[project]
name = "mumbai-hub-spoke-optimization"
version = "0.1.0"
description = "Two-stage hub-and-spoke pickup and delivery optimization over a synthetic Mumbai network"
# 3.12 rather than 3.11: numpy 2.5's bundled stubs use PEP 695 `type` statements, which mypy
# only analyses under a 3.12+ target. Keeping the metadata, ruff and mypy targets identical
# avoids checking against a version the toolchain cannot actually verify.
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "A",    # builtin shadowing
    "ANN",  # missing annotations
    "ARG",  # unused arguments
    "B",    # bugbear
    "C4",   # comprehensions
    "C90",  # mccabe complexity
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # naming
    "NPY",  # numpy-specific rules
    "PL",   # pylint
    "PTH",  # prefer pathlib
    "RET",  # return simplification
    "RUF",  # ruff-specific rules
    "SIM",  # simplification
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "D105",  # magic methods: the dataclass contract documents them
    "D107",  # dataclass __init__ is generated; the class docstring covers it
]
# Typography used deliberately in reports and docstrings: ranges, dimensions, coordinates.
allowed-confusables = ["–", "×", "°", "σ"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]  # comparing against literal expected values is the point of a test

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "pyarrow.*"]
ignore_missing_imports = true

# Neither ortools nor networkx ships a py.typed marker, so mypy cannot see their annotations and
# --strict fails at the import. Silencing it makes both libraries `Any` at the boundary, which is
# why every value crossing back — a flow amount, a routing index, a solver status — is narrowed
# explicitly at the call site rather than propagated.
[[tool.mypy.overrides]]
module = ["networkx.*", "ortools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "error",
    # ortools 9.15 is built with SWIG, whose SwigPyPacked, SwigPyObject and swigvarlink types
    # carry no __module__ attribute — which Python 3.14 deprecates. Under `error` the warning is
    # raised from inside _pywrapcp's module init, where an exception cannot be propagated, and
    # the interpreter segfaults during collection instead of failing a test. Not ours to fix, and
    # narrowed to this exact message so it cannot hide a warning from our own code.
    "ignore:builtin type \\w*[Ss]wig\\w* has no __module__ attribute:DeprecationWarning",
]
